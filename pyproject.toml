[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-app"
version = "0.1.0"
description = "Group capstone: weather analytics app built on the OpenWeatherMap API."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "streamlit",
    "pandas",
    "plotly",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
